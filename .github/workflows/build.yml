name: Compilar todos los mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: mc-1.16.5,  java: 21, gradle: 9.2.1 }
          - { dir: mc-1.18.2,  java: 21, gradle: 9.2.1 }
          - { dir: mc-1.19.4,  java: 21, gradle: 9.2.1 }
          - { dir: mc-1.20.1,  java: 21, gradle: 9.2.1 }
          - { dir: mc-1.21.1,  java: 21, gradle: 9.2.1 }
          - { dir: mc-1.21.11, java: 21, gradle: 9.2.1 }
          - { dir: mc-26.1.x,  java: 25, gradle: 9.4.0 }
          - { dir: mc-26.2,    java: 25, gradle: 9.4.0 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Compilar
        working-directory: ${{ matrix.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: coordhud-${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/*.jar
